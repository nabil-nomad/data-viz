[project]
name = "data-viz"
requires-python = ">=3.11"
version = "0.1.0"
description = "Data Visualization Projects"
authors = [{ name = "Nabil Khalil", email = "nabilamirkhalil@gmail.com" }]
readme = "README.md"

dependencies = [
    "matplotlib>=3.11.2,<4",
    "numpy>=2.4.6,<3",
    "pandas>=3.0.6,<4",
    "plotly>=7.1.0,<8",
    "requests>=2.34.2,<3",
]

[dependency-groups]
test = ["ruff>=0.16.10"]

[tool.uv]
default-groups = ["test"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"
